name: Build Lunyx AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK release (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renombrar APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Lunyx-AI-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lunyx-AI-APK
          path: Lunyx-AI-*.apk
